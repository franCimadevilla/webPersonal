name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Fecha del pie (CF-04): la del commit que se despliega.
      - name: Stamp last-updated date
        run: python3 tools/stamp-date.py
      # Índice del buscador (FU-01): se regenera para que no se quede atrás
      # si alguien cambia una página y olvida ejecutar el script en local.
      - name: Build search index
        run: python3 tools/build-search-index.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4